<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Carlos Casabianca</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0f14;
      color: #eaeaea;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(circle at top, #1a2330, #0b0f14);

    h1 {
      font-size: 3rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    p {
      opacity: 0.7;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div>
      <h1>Carlos Casabianca</h1>
      <p>Projects · Notes · Systems</p>
    </div>

</html>
