<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Leak Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="leak.css" />
</head>

<body>

    <div id="terminal">
        <div id="header">
            <div>INTERNAL LEAK TERMINAL</div>
            <div class="subtle">partial access granted</div>
        </div>

        <div id="controls">
            <button data-section="CLOSED PROJECT">&gt; VIEW CLOSED PROJECT</button>
            <button data-section="FAILED ATTEMPT">&gt; VIEW FAILED ATTEMPT</button>
            <button data-section="FLAGGED SUBJECT">&gt; VIEW FLAGGED SUBJECT</button>
            <button data-section="FUTURE PROJECT">&gt; VIEW FUTURE PROJECT</button>
        </div>

        <div id="output">
            <div class="subtle">select a recovered fragment</div>
        </div>

        <div id="footer">
            <button id="terminate">&gt; TERMINATE FEED</button>
        </div>
    </div>

    <script src="leak.js"></script>
</body>

</html>
